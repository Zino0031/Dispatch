name: ci
on:
  pull_request:
  push:
    branches: [main, dev]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
        working-directory: apps/backend
      - run: npm run lint
        working-directory: apps/backend
      - run: npm run build
        working-directory: apps/backend
  kiosk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/kiosk-client/package-lock.json
      - run: npm ci
        working-directory: apps/kiosk-client
      - run: npm run lint
        working-directory: apps/kiosk-client
      - run: npm run build
        working-directory: apps/kiosk-client
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
        working-directory: apps/backend
      - run: npm run build
        working-directory: apps/backend
      - run: bash scripts/check-env-examples.sh
      - run: bash scripts/check-contracts.sh
      - run: bash scripts/ci-smoke.sh
